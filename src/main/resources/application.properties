spring.application.name=mediconnect
# =====================================================
# LOGGING
# =====================================================
logging.pattern.console=${CONSOLE_LOG_PATTERN:%clr(%d{HH:mm:ss.SSS}){green} %clr(%-5level){blue} %clr([%thread]){red} %clr(%logger{20}){yellow} - %clr(%msg){cyan}%n}
# =====================================================
# POSTGRESQL DATASOURCE
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/mediconnect_db
spring.datasource.username=mediconnect_user
spring.datasource.password=mediconnect_pass
spring.datasource.driver-class-name=org.postgresql.Driver
# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
spring.jpa.properties.hibernate.default_batch_fetch_size=${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:50}
spring.jpa.open-in-view=false
# =====================================================
# SQL INITIALIZATION
# =====================================================
# spring.sql.init.mode=always
# =====================================================
# DOCKER COMPOSE
# =====================================================
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop
# =====================================================
# JWT
# =====================================================
mediconnect.jwt.secret=${JWT_SECRET:mediconnect-dev-secret-key-should-be-at-least-32-characters-long}
mediconnect.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# =====================================================
# CACHE
# =====================================================
mediconnect.cache.clinic-by-id.ttl=10m
mediconnect.cache.clinic-by-id.max-size=500
mediconnect.cache.clinic-list.ttl=5m
mediconnect.cache.clinic-list.max-size=200
# =====================================================
# CORS
# =====================================================
mediconnect.cors.allowed-origins=http://localhost:3000
mediconnect.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
mediconnect.cors.allowed-headers=Authorization,Content-Type,Accept
mediconnect.cors.allow-credentials=false
mediconnect.cors.max-age=1h
# =====================================================
# ACTUATOR
# =====================================================
management.endpoints.web.exposure.include=health,beans,conditions,configprops,env,metrics,mappings,info,caches,loggers
management.endpoint.health.show-details=never
management.endpoint.configprops.show-values=never
management.endpoint.env.show-values=never
# =====================================================
# ACTUATOR INFO
# =====================================================
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=MediConnect healthcare platform backend
# =====================================================
# OBSERVABILITY
# =====================================================
# Service identity
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
# Metrics
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s
# Traces
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.tracing.sampling.probability=1.0
# Logs
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs



